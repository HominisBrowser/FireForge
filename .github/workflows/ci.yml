name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Overlapping pushes cancel the older run: the quality job runs the full
# release:check suite and is expensive to duplicate.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Stable name: the branch-protection ruleset requires this exact check
    # context (scripts/setup-rulesets.sh). Embedding the Node version here
    # silently invalidated the required check on every Node bump.
    name: quality (ubuntu)
    runs-on: ubuntu-latest
    # A red suite waits out every per-test timeout, so an unbounded job can
    # run for hours. The cap makes a hung or failing run stop and report.
    timeout-minutes: 30
    steps:
      # Full history: `whitespace:check` diffs the PR range, which needs the
      # base commit present. A depth-1 checkout would silently degrade it to
      # the tip-commit form.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Pin npm to the packageManager version
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VERSION}"
      - run: npm ci
      - name: Guard against comment punctuation stranded by a ticket-ID scrub
        run: |
          if grep -rnE '^[[:space:]]*(//|\*)[[:space:]]*[.,;:] ' src --include='*.ts'; then
            echo "Comment lines beginning with stranded sentence punctuation (see above)." >&2
            echo "Join each to the end of the preceding comment line." >&2
            exit 1
          fi
      - run: npm run release:check
        env:
          WHITESPACE_CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

  smoke:
    # Stable name, for the same reason `quality (ubuntu)` above carries one:
    # the branch-protection ruleset requires these exact check contexts, and
    # embedding the Node version made every Node bump silently invalidate
    # all three of them.
    name: smoke (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    # Same bound as `quality`, wide enough for the slowest OS leg.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Pin npm to the packageManager version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VERSION}"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:package
      # The whole suite runs on every OS in the matrix, so platform-specific code
      # paths are covered. Suites that need the POSIX-only job coordinator are
      # excluded on Windows by vitest.config.ts, not by a list kept here.
      - run: npm test

  # Node-version axis, Ubuntu only. A separate job rather than a wider
  # `smoke` matrix: the ruleset requires the three `smoke (<os>)` contexts
  # by exact name (scripts/setup-rulesets.sh), and adding a second matrix
  # dimension would rename all of them. `22` is the engines floor
  # (`>=22.22.2`), `24` the next LTS line, and `.nvmrc` the pinned dev
  # version, so the floor is exercised on every PR instead of only being
  # claimed in `engines`.
  node-floor:
    name: node-floor (${{ matrix.node }})
    needs: quality
    runs-on: ubuntu-latest
    # Same bound as `quality`.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', 'nvmrc']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.node != 'nvmrc'
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.node == 'nvmrc'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Pin npm to the packageManager version
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VERSION}"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
