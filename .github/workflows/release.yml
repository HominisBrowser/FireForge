name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0, 0.10.0-beta.1). Leave empty to use the version already in package.json.'
        required: false
        type: string
      dry-run:
        description: 'Dry run — validate everything but do not publish or push tags.'
        required: false
        type: boolean
        default: false

# Read-only by default: the `verify` job runs the whole suite and every
# dependency's code, and gets no more than that. The `publish` job names what
# it needs.
permissions:
  contents: read

# Two releases never overlap: the publish and the tag push of one finish
# before another starts, and a running release is never cancelled, since it
# may be between the publish and the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The release gate: CI's static checks and the test suite with coverage on
  # this commit, in parallel, before anything is published.
  verify:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    with:
      smoke: false

  release:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # Pushes the version commit and the tag.
      contents: write
      # Trusted publishing and provenance.
      id-token: write
    # Builds, packs and publishes; the gate already ran in `verify`.
    timeout-minutes: 20
    steps:
      # The credentials stay in the checkout: the last step pushes the version
      # commit and the tag with them.
      - uses: actions/checkout@v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, which the Node 22 bundled npm
      # predates. Install the exact version pinned in package.json's
      # packageManager field (derived, so the two cannot drift) instead of
      # npm@latest, so a release is reproducible and a fresh npm major cannot
      # change publish behavior unreviewed.
      - name: Pin npm to the packageManager version
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VERSION}"
          npm --version

      - run: npm ci

      - name: Bump version (if specified)
        if: inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        # `npm version` refuses to set the version package.json already has,
        # which is the case when the input repeats the committed version.
        run: |
          CURRENT="$(node -p 'require("./package.json").version')"
          if [ "$CURRENT" != "$INPUT_VERSION" ]; then
            npm version "$INPUT_VERSION" --no-git-tag-version
          fi

      # The bump is committed BEFORE anything builds. `npm version
      # --no-git-tag-version` leaves package.json/package-lock.json modified
      # in the worktree, and prepack stamps dist/build-info.json from live
      # git state, so a bump left uncommitted would publish a `.dirty` identity
      # naming the pre-bump commit, with the tag on a commit that was never
      # built. Committing first makes the tree clean at prepack, and makes the
      # published `+g<sha>` the same commit the tag below points at. Runs on
      # dry-run too (the runner is ephemeral, nothing is pushed), so a dry run
      # validates the real identity.
      - name: Commit version bump
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          VERSION="$(node -p 'require("./package.json").version')"
          git diff --cached --quiet || git commit -m "release: v$VERSION"

      # `npm publish` (and `npm publish --dry-run`) fire `prepublishOnly`, the
      # release gate. FIREFORGE_RELEASE_VERIFIED names the commit `verify`
      # gated, so it is not run a second time when this tree differs from that
      # commit only by the version bump above; anything else runs it again.
      - name: Determine version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # A run that failed after the publish is rerun as it is: the registry
      # answers whether this exact version is already there, and the publish
      # below is skipped when it is and was published from this very commit.
      # A version published from another commit fails the run, since a tag on
      # this commit would name source the package was not built from. Any
      # answer but 200 and 404 fails the run rather than guessing.
      - name: Check whether this version is on the registry
        id: registry
        if: inputs.dry-run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NAME="$(node -p 'require("./package.json").name')"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          STATUS="$(curl --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/published.json" \
            --write-out '%{http_code}' "https://registry.npmjs.org/${NAME/\//%2F}/${VERSION}")"
          case "$STATUS" in
            200) PUBLISHED_FROM="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).gitHead || ""' "$RUNNER_TEMP/published.json")"
                 if [ "$PUBLISHED_FROM" != "$HEAD_COMMIT" ]; then
                   echo "${NAME}@${VERSION} is on the registry, published from commit ${PUBLISHED_FROM:-unknown}; this run is at ${HEAD_COMMIT}. A version is published once: release a new version." >&2
                   exit 1
                 fi
                 echo "published=true" >> "$GITHUB_OUTPUT"
                 echo "${NAME}@${VERSION} is already on the registry from this commit; it is not published again." ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "The registry answered ${STATUS} for ${NAME}@${VERSION}." >&2
               exit 1 ;;
          esac

      # FIREFORGE_PACK_STRICT turns prepack's dirty-tree banner into a hard
      # refusal, so the ordering above is self-enforcing: if anything dirties
      # the worktree before publish, the release fails loudly instead of
      # shipping an artifact no commit can reproduce.
      - name: Publish to npm
        if: inputs.dry-run != true && steps.registry.outputs.published != 'true'
        env:
          FIREFORGE_PACK_STRICT: '1'
          FIREFORGE_RELEASE_VERIFIED: ${{ github.sha }}
        run: npm publish --provenance --access public

      - name: Publish dry run
        if: inputs.dry-run == true
        env:
          FIREFORGE_PACK_STRICT: '1'
          FIREFORGE_RELEASE_VERIFIED: ${{ github.sha }}
        run: npm publish --dry-run

      # Tag last, and only when origin does not have it yet, so a run that
      # failed here is rerun as it is. A tag origin has on another commit
      # fails the run. The version commit and the tag go in one atomic push:
      # both reach origin or neither does.
      - name: Tag and push
        if: inputs.dry-run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          STATUS=0
          FOUND="$(git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}")" || STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            HEAD_COMMIT="$(git rev-parse HEAD)"
            if [ "${FOUND%%[[:space:]]*}" != "$HEAD_COMMIT" ]; then
              echo "Tag v${VERSION} is on origin at ${FOUND%%[[:space:]]*}; this run is at ${HEAD_COMMIT}." >&2
              exit 1
            fi
            echo "Tag v${VERSION} is already on origin at this commit; nothing to push."
            exit 0
          fi
          if [ "$STATUS" -ne 2 ]; then
            echo "Could not look up tag v${VERSION} on origin (git exit ${STATUS})." >&2
            exit "$STATUS"
          fi
          git tag "v${VERSION}"
          git push --atomic origin HEAD "refs/tags/v${VERSION}"
