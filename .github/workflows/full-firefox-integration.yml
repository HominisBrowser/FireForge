name: Full Firefox Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  full-firefox:
    name: full-firefox (self-hosted)
    runs-on:
      - self-hosted
      - firefox-large
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.1'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:firefox-full
        env:
          FIREFORGE_FULL_PROJECT_ROOT: ${{ vars.FIREFORGE_FULL_PROJECT_ROOT }}
