name: Full Firefox Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  full-firefox:
    name: full-firefox (self-hosted)
    runs-on:
      - self-hosted
      - firefox-large
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:firefox-full
        env:
          FIREFORGE_FULL_PROJECT_ROOT: ${{ vars.FIREFORGE_FULL_PROJECT_ROOT }}
