name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Overlapping pushes cancel the older run — the quality job runs the full
# release:check suite and is expensive to duplicate.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Stable name: the branch-protection ruleset requires this exact check
    # context (scripts/setup-rulesets.sh). Embedding the Node version here
    # silently invalidated the required check on every Node bump.
    name: quality (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.1'
          cache: 'npm'
      - name: Pin npm to the packageManager version
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VERSION}"
      - run: npm ci
      - run: npm run release:check

  smoke:
    name: smoke (${{ matrix.os }}, node ${{ matrix.node-version }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: '22.22.1'
          - os: macos-latest
            node-version: '22.22.1'
          - os: windows-latest
            node-version: '22.22.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Pin npm to the packageManager version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VERSION}"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:package
      # Cross-platform unit subset: the path/fs/git/process/lock helpers do
      # the platform-sensitive work (path handling, spawning, git orchestration),
      # so they run on every OS in the matrix, not just the Ubuntu quality gate.
      - run: >-
          npm test --
          src/utils/__tests__/fs.test.ts
          src/utils/__tests__/paths.test.ts
          src/utils/__tests__/process.test.ts
          src/core/__tests__/git.test.ts
          src/core/__tests__/git-diff.test.ts
          src/core/__tests__/git-index-lock.test.ts
          src/core/__tests__/git-performance.test.ts
          src/core/__tests__/file-lock.test.ts
      - run: npm test -- src/commands/__tests__/firefox-workflows.integration.test.ts
