version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    reviewers:
      - Topfi
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'
    groups:
      # vitest and @vitest/coverage-v8 pin each other by exact version, so a
      # major bump of one alone is unresolvable (ERESOLVE). Group them for
      # every update type. Groups match in order, so this sits first.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    reviewers:
      - Topfi
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns:
          - '*'
