name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Overlapping pushes cancel the older run — the quality job runs the full
# release:check suite and is expensive to duplicate.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Stable name: the branch-protection ruleset requires this exact check
    # context (scripts/setup-rulesets.sh). Embedding the Node version here
    # silently invalidated the required check on every Node bump.
    name: quality (ubuntu)
    runs-on: ubuntu-latest
    steps:
      # Full history: `whitespace:check` diffs the PR range, which needs the
      # base commit present. A depth-1 checkout would silently degrade it to
      # the tip-commit form.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.1'
          cache: 'npm'
      - name: Pin npm to the packageManager version
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VERSION}"
      - run: npm ci
      - name: Guard against comment punctuation stranded by a ticket-ID scrub
        run: |
          if grep -rnE '^[[:space:]]*(//|\*)[[:space:]]*[.,;:] ' src --include='*.ts'; then
            echo "Comment lines beginning with stranded sentence punctuation (see above)." >&2
            echo "Join each to the end of the preceding comment line." >&2
            exit 1
          fi
      - run: npm run release:check
        env:
          WHITESPACE_CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

  smoke:
    # Stable name, for the same reason `quality (ubuntu)` above carries one:
    # the branch-protection ruleset requires these exact check contexts, and
    # embedding the Node version made every Node bump silently invalidate
    # all three of them.
    name: smoke (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: '22.22.1'
          - os: macos-latest
            node-version: '22.22.1'
          - os: windows-latest
            node-version: '22.22.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Pin npm to the packageManager version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VERSION}"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:package
      # The whole suite runs on every OS in the matrix. It was previously a
      # hand-listed 10-file subset that nothing kept in sync: 15 of the 17
      # test files that branch on `win32` had drifted out of it, so the
      # platform-specific code paths this leg exists to cover were the ones
      # not running. The full suite takes ~35s, which is cheaper than
      # maintaining the list.
      - run: npm test
