name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0, 0.10.0-beta.1). Leave empty to use the version already in package.json.'
        required: false
        type: string
      dry-run:
        description: 'Dry run — validate everything but do not publish or push tags.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.1'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, which the Node 22 bundled npm
      # predates. Install the exact version pinned in package.json's
      # packageManager field (derived, so the two cannot drift) instead of
      # npm@latest, so a release is reproducible and a fresh npm major cannot
      # change publish behavior unreviewed.
      - name: Pin npm to the packageManager version
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install -g "npm@${NPM_VERSION}"
          npm --version

      - run: npm ci

      - name: Bump version (if specified)
        if: inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: npm version "$INPUT_VERSION" --no-git-tag-version

      - name: Run release checks
        run: npm run release:check

      - name: Determine version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: inputs.dry-run != true
        run: npm publish --provenance --access public

      - name: Publish dry run
        if: inputs.dry-run == true
        run: npm publish --dry-run

      - name: Tag and push
        if: inputs.dry-run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "release: v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD --tags
